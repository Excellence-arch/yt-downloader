<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player & Direct Save | YT Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(18, 20, 30, 0.85);
      --primary: #ff0033;
      --primary-hover: #e6002e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient glow */
    .glow {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 0, 51, 0.25), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .player-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .player-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
      color: white;
    }

    .instruction-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    .instruction-pill svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Video Player Frame */
    .video-frame {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    .player-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff003b, #d9002c);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 0, 51, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ff1a4f, #eb0033);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="player-container">
    <div class="player-header">
      <h1 class="video-title" id="page-video-title">Playing Video...</h1>
      <div class="instruction-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span><strong>Easy Save:</strong> Right-click on the video and click <strong>"Save video as..."</strong>, or click the 3 dots (⋮) on the video bar!</span>
      </div>
    </div>

    <div class="video-frame">
      <video id="player" controls autoplay playsinline preload="auto">
        Your browser does not support HTML5 video streaming.
      </video>
    </div>

    <div class="player-actions">
      <a href="#" class="btn btn-primary" id="btn-download-direct" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download File to Device</span>
      </a>

      <button class="btn btn-secondary" onclick="window.close() || history.back()">
        <span>Back to Downloader</span>
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      let title = params.get('title') || '';
      const height = params.get('height') || '720';
      const format = params.get('format') || 'webm';
      const audioOnly = params.get('audioOnly') === 'true';

      const titleEl = document.getElementById('page-video-title');
      const dlLink = document.getElementById('btn-download-direct');
      const player = document.getElementById('player');

      if (title) {
        titleEl.textContent = title;
        document.title = `${title} | Player`;
      } else {
        titleEl.textContent = 'Loading video...';
        // Fast 50ms oEmbed title fetch
        if (url) {
          fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`)
            .then(r => r.json())
            .then(d => {
              if (d && d.title) {
                title = d.title;
                titleEl.textContent = title;
                document.title = `${title} | Player`;
                updateDlLink();
              }
            })
            .catch(() => {});
        }
      }

      function updateDlLink() {
        const dlParams = new URLSearchParams({
          url,
          title: title || 'video',
          height,
          format: 'mp4',
          audioOnly: audioOnly ? 'true' : 'false',
          inline: 'false'
        });
        dlLink.href = `/api/stream?${dlParams.toString()}`;
        dlLink.setAttribute('download', `${title || 'video'}.mp4`);
      }

      if (url) {
        // Stream URL with inline=true for instant HTML5 playback
        const streamParams = new URLSearchParams({
          url,
          title: title || 'video',
          height,
          format: 'webm',
          audioOnly: audioOnly ? 'true' : 'false',
          inline: 'true'
        });

        player.src = `/api/stream?${streamParams.toString()}`;
        updateDlLink();

        player.addEventListener('loadeddata', () => {
          player.play().catch(() => {});
        });
      } else {
        titleEl.textContent = 'No video URL provided.';
      }
    });
  </script>
</body>
</html>
